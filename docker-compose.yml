x-app: &app
  build: .
  env_file: .env
  depends_on: [db, redis]
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: mx, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: mx}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3"
  worker:
    <<: *app
    # one worker slot per concurrently-running user strategy: raise --concurrency as users grow
    command: celery -A config worker -l info --concurrency=20
  beat:
    <<: *app
    command: celery -A config beat -l info
  caddy:                      # automatic HTTPS (Let's Encrypt) for your public domain
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile", caddy_data:/data]
    depends_on: [web]
    restart: unless-stopped
volumes: {pgdata: {}, caddy_data: {}}
